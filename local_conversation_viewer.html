<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Conversation Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border: 1px solid #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }
        
        .header {
            background: #000000;
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid #000000;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border: 1px solid #000000;
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            transition: all 0.2s;
            background: transparent;
        }
        
        .btn-primary {
            background: white;
            color: #000000;
        }
        
        .btn-primary:hover {
            background: #000000;
            color: white;
        }
        
        .btn-secondary {
            background: transparent;
            color: white;
            border: 1px solid white;
        }
        
        .btn-secondary:hover {
            background: white;
            color: #000000;
        }
        
        .upload-section {
            padding: 40px;
            text-align: center;
            background: #ffffff;
            border-top: 1px solid #000000;
        }
        
        .upload-section input {
            margin: 20px 0;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        
        .sidebar {
            width: 350px;
            border-right: 1px solid #000000;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            min-height: 0;
            flex-shrink: 0;
        }
        
        .search-box {
            padding: 16px;
            border-bottom: 1px solid #000000;
            flex-shrink: 0;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #000000;
            font-size: 14px;
            margin-bottom: 8px;
            background: white;
        }

        .filter-section {
            padding: 16px;
            border-bottom: 1px solid #000000;
            background: white;
            flex-shrink: 0;
        }

        .filter-title {
            font-size: 12px;
            font-weight: 400;
            color: #000000;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-group {
            margin-bottom: 12px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            color: #000000;
            margin-bottom: 4px;
        }

        .filter-group input, .filter-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #000000;
            font-size: 13px;
            background: white;
        }

        .filter-row {
            display: flex;
            gap: 8px;
        }

        .filter-row input {
            flex: 1;
        }

        .btn-clear {
            padding: 6px 12px;
            background: #000000;
            color: white;
            border: 1px solid #000000;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            width: 100%;
        }

        .btn-clear:hover {
            background: white;
            color: #000000;
        }
        
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            min-height: 0;
        }
        
        .conversation-item {
            padding: 16px;
            margin-bottom: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e0e0e0;
        }
        
        .conversation-item:hover {
            background: #f5f5f5;
            border-color: #000000;
        }
        
        .conversation-item.active {
            border-color: #000000;
            background: #f5f5f5;
        }
        
        .conversation-id {
            font-size: 12px;
            color: #666666;
            margin-bottom: 4px;
            font-family: monospace;
        }
        
        .conversation-preview {
            font-size: 14px;
            color: #000000;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .conversation-meta {
            font-size: 11px;
            color: #666666;
            margin-top: 4px;
        }
        
        .conversation-tags {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        
        .tag {
            display: inline-block;
            padding: 2px 8px;
            background: #000000;
            color: white;
            font-size: 11px;
            border: 1px solid #000000;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        
        .chat-header {
            padding: 20px 32px;
            border-bottom: 1px solid #000000;
            background: white;
            flex-shrink: 0;
        }
        
        .chat-header h2 {
            font-size: 18px;
            color: #000000;
            margin-bottom: 8px;
            font-weight: 400;
        }
        
        .tag-input-area {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 12px;
        }
        
        .tag-input-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #000000;
            font-size: 13px;
            background: white;
        }
        
        .tag-input-area button {
            padding: 8px 16px;
            background: #000000;
            color: white;
            border: 1px solid #000000;
            cursor: pointer;
            font-size: 13px;
        }
        
        .tag-input-area button:hover {
            background: white;
            color: #000000;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background: #ffffff;
            min-height: 0;
        }
        
        .message {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }
        
        .message-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .message-type {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 400;
            border: 1px solid #000000;
        }
        
        .message-type.output {
            background: #000000;
            color: white;
        }
        
        .message-type.input {
            background: white;
            color: #000000;
        }
        
        .message-time {
            font-size: 12px;
            color: #666666;
        }
        
        .message-content {
            background: white;
            padding: 16px 20px;
            box-shadow: none;
            position: relative;
            border: 1px solid #e0e0e0;
        }
        
        .message-text {
            color: #000000;
            line-height: 1.8;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .message-text strong {
            display: inline-block;
            margin-top: 8px;
            margin-bottom: 2px;
            font-weight: 600;
            color: #000000;
        }

        .message-text strong:first-child {
            margin-top: 0;
        }

        .message-text em {
            display: block;
            margin-top: 6px;
            font-style: italic;
            color: #666666;
        }
        
        .comment-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #000000;
        }
        
        .comment-input {
            display: flex;
            gap: 8px;
        }
        
        .comment-input textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #000000;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
            background: white;
        }
        
        .comment-input button {
            padding: 8px 16px;
            background: #000000;
            color: white;
            border: 1px solid #000000;
            cursor: pointer;
            font-size: 13px;
            align-self: flex-start;
        }
        
        .comment-input button:hover {
            background: white;
            color: #000000;
        }
        
        .comments-list {
            margin-top: 12px;
        }
        
        .comment {
            background: #f5f5f5;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #000000;
            border-left: 2px solid #000000;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #666666;
        }
        
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #000000;
            font-weight: 400;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666666;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 13px;
            color: #666666;
        }

        #chatContent {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .product-images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #000000;
        }

        .product-image-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .product-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 1px solid #000000;
            box-shadow: none;
            transition: transform 0.2s;
        }

        .product-image:hover {
            transform: scale(1.05);
        }

        .product-id-label {
            font-size: 11px;
            color: #666666;
            font-family: monospace;
            background: #f5f5f5;
            padding: 3px 8px;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 AI Conversation Viewer</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="loadAnnotations()">📥 Load Annotations</button>
                <button class="btn btn-secondary" onclick="exportAnnotations()">💾 Export Annotations</button>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleFileSelect(event)" style="display: none;">
                <label for="fileInput" class="btn btn-primary">📁 Load Excel File</label>
            </div>
        </div>

        <div id="uploadSection" class="upload-section">
            <h2>👋 Welcome!</h2>
            <p>Click "Load Excel File" to get started</p>
            <p style="margin-top: 10px; font-size: 14px; color: #6b7280;">
                Expected columns: External Record Id, Channel Name, Message Sent Timestamp, AI Agent Interaction Message Type, Content
            </p>
        </div>

        <div id="mainContent" class="main-content" style="display: none;">
            <div class="sidebar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search conversations..." oninput="applyFilters()">
                </div>
                <div class="filter-section">
                    <div class="filter-title">📊 Filters</div>
                    
                    <div class="filter-group">
                        <label>Date Range</label>
                        <div class="filter-row">
                            <input type="date" id="dateFrom" onchange="applyFilters()">
                            <input type="date" id="dateTo" onchange="applyFilters()">
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Message Count</label>
                        <div class="filter-row">
                            <input type="number" id="msgCountMin" placeholder="Min" min="0" onchange="applyFilters()">
                            <input type="number" id="msgCountMax" placeholder="Max" min="0" onchange="applyFilters()">
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Conversation ID</label>
                        <input type="text" id="convIdFilter" placeholder="Filter by ID..." oninput="applyFilters()">
                    </div>

                    <button class="btn-clear" onclick="clearFilters()">🗑️ Clear Filters</button>
                </div>
                <div class="conversation-list" id="conversationList"></div>
            </div>

            <div class="chat-area">
                <div id="chatEmpty" class="empty-state">
                    <h3>Select a conversation</h3>
                    <p>Choose a conversation from the left to view messages</p>
                </div>
                <div id="chatContent">
                    <div class="chat-header">
                        <h2 id="conversationTitle">Conversation</h2>
                        <div class="stats" id="conversationStats"></div>
                        <div class="tag-input-area">
                            <input type="text" id="tagInput" placeholder="Add tags (e.g., resolved, bug, important)">
                            <button onclick="addTag()">Add Tag</button>
                        </div>
                        <div class="conversation-tags" id="conversationTagsDisplay"></div>
                        <div class="comment-section">
                            <div class="comment-input">
                                <textarea placeholder="Add a comment for this conversation..." id="conversationComment"></textarea>
                                <button onclick="addConversationComment()">💬 Add</button>
                            </div>
                            <div class="comments-list" id="conversationCommentsList">
                            </div>
                        </div>
                    </div>
                    <div class="messages" id="messagesContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let conversations = {};
        let annotations = {
            tags: {},
            comments: {}
        };
        let currentConversationId = null;
        let allConversations = [];

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                console.log('File loaded, size:', data.length, 'bytes');

                try {
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheetName = workbook.SheetNames[0];
                    const firstSheet = workbook.Sheets[sheetName];

                    const rawData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                    let headers = null;
                    let headerIndex = -1;
                    for (let i = 0; i < rawData.length; i++) {
                        const row = rawData[i];
                        if (row.some(cell => cell && cell.toString().includes('External Record Id'))) {
                            headers = row;
                            headerIndex = i;
                            break;
                        }
                    }

                    if (!headers) {
                        alert('Could not find header row containing "External Record Id"');
                        return;
                    }

                    const jsonData = [];
                    for (let i = headerIndex + 1; i < rawData.length; i++) {
                        const row = rawData[i];
                        if (!row || row.length === 0 || row.every(cell => !cell)) continue;
                        const obj = {};
                        headers.forEach((h, idx) => obj[h || `col_${idx}`] = row[idx]);
                        jsonData.push(obj);
                    }

                    processData(jsonData);
                } catch (err) {
                    alert('Error reading Excel file: ' + err.message);
                    return;
                }

                console.log('Conversations processed:', Object.keys(conversations).length);

                allConversations = Object.values(conversations);
                console.log('Total conversations:', allConversations.length);

                displayConversations();

                document.getElementById('uploadSection').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
            };
            reader.readAsArrayBuffer(file);
        }

        function processData(jsonData) {
            conversations = {};
            let currentConvId = null;

            jsonData.forEach((row, index) => {
                if (index < 3) {
                    console.log(`Row ${index}:`, row);
                }

                const id = row['External Record Id  ↑'];
                const content = row['Content'];

                if (id) {
                    currentConvId = id;
                    if (!conversations[id]) {
                        conversations[id] = { id: id, messages: [] };
                    }
                }

                if (currentConvId && content) {
                    const message = {
                        timestamp: row['Message Sent Timestamp'],
                        type: row['AI Agent Interaction Message Type'],
                        content: content,
                        channel: row['Channel Name']
                    };

                    conversations[currentConvId].messages.push(message);
                }
            });

            // Sort messages within each conversation by timestamp in chronological order
            Object.values(conversations).forEach(conv => {
                conv.messages.sort((a, b) => {
                    const dateA = new Date(a.timestamp);
                    const dateB = new Date(b.timestamp);
                    
                    // Handle invalid dates by putting them at the end
                    if (isNaN(dateA)) return 1;
                    if (isNaN(dateB)) return -1;
                    
                    return dateA - dateB;
                });
                
                // Log first conversation's sorted timestamps for verification
                if (Object.keys(conversations).indexOf(conv.id) === 0) {
                    console.log('First conversation sorted timestamps:', 
                        conv.messages.map(m => m.timestamp));
                }
            });
        }
        
        function displayConversations() {
            const listEl = document.getElementById('conversationList');
            listEl.innerHTML = '';

            allConversations.forEach(conv => {
                const div = document.createElement('div');
                div.className = 'conversation-item';
                div.onclick = (e) => selectConversation(conv.id, e.currentTarget);
                div.dataset.convId = conv.id;
                div.dataset.msgCount = conv.messages.length;
                
                if (conv.messages.length > 0) {
                    const dates = conv.messages
                        .map(m => m.timestamp ? new Date(m.timestamp) : null)
                        .filter(d => d && !isNaN(d));
                    if (dates.length > 0) {
                        div.dataset.date = Math.min(...dates);
                    }
                }
                
                const preview = conv.messages[0]?.content?.substring(0, 60) || 'No content';
                const tags = annotations.tags[conv.id] || [];
                
                div.innerHTML = `
                    <div class="conversation-id">ID: ${conv.id}</div>
                    <div class="conversation-preview">${preview}...</div>
                    <div class="conversation-meta">${conv.messages.length} messages</div>
                    ${tags.length > 0 ? `<div class="conversation-tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
                `;
                
                listEl.appendChild(div);
            });

            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const msgCountMin = document.getElementById('msgCountMin').value;
            const msgCountMax = document.getElementById('msgCountMax').value;
            const convIdFilter = document.getElementById('convIdFilter').value.toLowerCase();
            
            const items = document.querySelectorAll('.conversation-item');
            let visibleCount = 0;
            
            items.forEach(item => {
                let show = true;
                
                if (search && !item.textContent.toLowerCase().includes(search)) {
                    show = false;
                }
                
                if (convIdFilter && !item.dataset.convId.toLowerCase().includes(convIdFilter)) {
                    show = false;
                }
                
                if (dateFrom || dateTo) {
                    const itemDate = item.dataset.date ? new Date(parseInt(item.dataset.date)) : null;
                    if (itemDate) {
                        if (dateFrom && itemDate < new Date(dateFrom)) show = false;
                        if (dateTo && itemDate > new Date(dateTo + 'T23:59:59')) show = false;
                    } else if (dateFrom || dateTo) {
                        show = false;
                    }
                }
                
                const msgCount = parseInt(item.dataset.msgCount);
                if (msgCountMin && msgCount < parseInt(msgCountMin)) show = false;
                if (msgCountMax && msgCount > parseInt(msgCountMax)) show = false;
                
                item.style.display = show ? 'block' : 'none';
                if (show) visibleCount++;
            });

            document.getElementById('searchInput').placeholder = 
                `🔍 Search conversations... (${visibleCount} of ${items.length})`;
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';
            document.getElementById('msgCountMin').value = '';
            document.getElementById('msgCountMax').value = '';
            document.getElementById('convIdFilter').value = '';
            applyFilters();
        }

        function selectConversation(convId, target) {
            currentConversationId = convId;
            const conv = conversations[convId];

            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            target.classList.add('active');
            
            document.getElementById('chatEmpty').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            
            document.getElementById('conversationTitle').textContent = `Conversation: ${convId}`;
            
            const inputCount = conv.messages.filter(m => m.type === 'Input').length;
            const outputCount = conv.messages.filter(m => m.type === 'Output').length;
            document.getElementById('conversationStats').innerHTML = `
                <span>📨 ${inputCount} inputs</span>
                <span>💬 ${outputCount} outputs</span>
                <span>⏱️ ${conv.messages.length} total</span>
            `;
            
            displayConversationTags();
            displayConversationComments();
            displayMessages(conv);
        }

        function displayConversationTags() {
            const tags = annotations.tags[currentConversationId] || [];
            const display = document.getElementById('conversationTagsDisplay');
            display.innerHTML = tags.map(tag => 
                `<span class="tag">${tag} <span style="cursor: pointer; margin-left: 4px;" onclick="removeTag('${tag}')">×</span></span>`
            ).join('');
        }

        function addTag() {
            if (!currentConversationId) return;
            
            const input = document.getElementById('tagInput');
            const tag = input.value.trim();
            
            if (tag) {
                if (!annotations.tags[currentConversationId]) {
                    annotations.tags[currentConversationId] = [];
                }
                
                if (!annotations.tags[currentConversationId].includes(tag)) {
                    annotations.tags[currentConversationId].push(tag);
                    displayConversationTags();
                    displayConversations();
                }
                
                input.value = '';
            }
        }

        function removeTag(tag) {
            if (!currentConversationId) return;
            
            const tags = annotations.tags[currentConversationId];
            const index = tags.indexOf(tag);
            if (index > -1) {
                tags.splice(index, 1);
                displayConversationTags();
                displayConversations();
            }
        }

        function extractProductIds(text) {
            if (!text) return [];
            // Match common product ID patterns (adjust regex based on your actual format)
            // This looks for patterns like: 123456, SKU-123456, or common alphanumeric codes
            const patterns = [
                /\b\d{6,8}\b/g,  // 6-8 digit numbers
                /\b[A-Z0-9]{6,10}\b/g,  // Alphanumeric codes
                /\b[0-9]{3,5}-[0-9A-Z]{2,4}\b/g  // Patterns like 12345-AB
            ];
            
            const ids = new Set();
            patterns.forEach(pattern => {
                const matches = text.match(pattern);
                if (matches) {
                    matches.forEach(id => ids.add(id));
                }
            });
            
            return Array.from(ids);
        }

        function createProductImages(productIds) {
            if (productIds.length === 0) return '';
            
            const imagesHtml = productIds.map(id => {
                const imgUrl = `https://au.pandora.net/dw/image/v2/BKNF_PRD/on/demandware.static/-/Sites-pandora-master-catalog/default/dwfcb90575/productimages/main_rect_base/${id}_RGB.jpg?q=50&sfrm=png&bgcolor=F7F7F7&sw=1200`;
                return `
                    <div class="product-image-wrapper">
                        <img src="${imgUrl}" 
                             alt="Product ${id}" 
                             class="product-image"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="product-id-label" style="display:none;">Product ${id} (image not available)</div>
                        <div class="product-id-label">${id}</div>
                    </div>
                `;
            }).join('');
            
            return `<div class="product-images-container">${imagesHtml}</div>`;
        }

        function parseAgentOutput(content) {
            if (!content) return { formatted: content, productIds: [] };

            try {
                // Try to parse as JSON
                const parsed = JSON.parse(content);

                // Check if it's the new format with conversationAnswer, followup, productIds, refinements
                if (parsed.conversationAnswer || parsed.followup || parsed.productIds || parsed.refinements) {
                    let formatted = '';

                    // Add conversation answer
                    if (parsed.conversationAnswer) {
                        formatted += `${parsed.conversationAnswer}\n\n`;
                    }

                    // Add followup question
                    if (parsed.followup) {
                        formatted += `<em>${parsed.followup}</em>\n\n`;
                    }

                    // Add refinements if they exist and have non-empty values
                    if (parsed.refinements && Array.isArray(parsed.refinements)) {
                        const validRefinements = parsed.refinements.filter(r => r && r.trim());
                        if (validRefinements.length > 0) {
                            formatted += `<strong>Refinements:</strong> ${validRefinements.join(', ')}\n\n`;
                        }
                    }

                    // Extract product IDs from the productIds array
                    const productIds = parsed.productIds && Array.isArray(parsed.productIds) ? parsed.productIds : [];

                    return { formatted: formatted.trim(), productIds: productIds };
                }

                // Fallback: Check if it's the old format with results array
                if (parsed.results && Array.isArray(parsed.results)) {
                    let formatted = '';

                    // Extract product IDs (numbers/codes at the start)
                    const productIds = parsed.results.filter(item =>
                        /^[A-Z0-9]{6,10}$/.test(item)
                    );

                    // Extract other information
                    parsed.results.forEach(item => {
                        if (typeof item === 'string') {
                            if (item.startsWith('refinements:')) {
                                const refinements = item.replace('refinements:', '').split(',').filter(r => r.trim());
                                if (refinements.length > 0) {
                                    formatted += '\n<strong>Attributes:</strong> ';
                                    formatted += refinements.map(r => r.trim()).join(', ') + '\n';
                                }
                            } else if (item.startsWith('ProductNames:')) {
                                const names = item.replace('ProductNames:', '').split(',').map(n => n.trim()).filter(n => n);
                                if (names.length > 0) {
                                    formatted += '\n<strong>Products Titles:</strong> ';
                                    formatted += names.join(', ') + '\n';
                                }
                            } else if (item.startsWith('ProductThemes:')) {
                                const themes = item.replace('ProductThemes:', '').split(',').map(t => t.trim()).filter(t => t);
                                if (themes.length > 0) {
                                    formatted += '\n<strong>Themes:</strong> ';
                                    formatted += themes.join(', ') + '\n';
                                }
                            } else if (item.startsWith('Query:')) {
                                formatted = `<strong>Search Query:</strong> ${item.replace('Query:', '').trim()}\n` + formatted;
                            }
                        }
                    });

                    // Add conversation answer if exists
                    if (parsed.conversationAnswer) {
                        formatted += `\n<strong>Agent Response:</strong> ${parsed.conversationAnswer}\n`;
                    }

                    // Add followup if exists
                    if (parsed.followup) {
                        formatted += `\n<em>${parsed.followup}</em>`;
                    }

                    // Add product IDs section
                    if (productIds.length > 0) {
                        formatted += `\n\n<strong>Product IDs:</strong> ${productIds.join(', ')}`;
                    }

                    return { formatted: formatted.trim(), productIds: productIds };
                }
            } catch (e) {
                // Not JSON or parsing failed, return as is
            }

            return { formatted: content, productIds: [] };
        }

        function displayMessages(conv) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            conv.messages.forEach((msg, idx) => {
                const div = document.createElement('div');
                div.className = 'message';
                
                let messageContent = msg.content || 'No content';
                let productIds = [];
                
                // Only process Output (agent) messages
                if (msg.type === 'Output') {
                    const parsed = parseAgentOutput(msg.content);
                    if (parsed.formatted) {
                        messageContent = parsed.formatted;
                        productIds = parsed.productIds || [];
                    }
                    
                    // If no product IDs from JSON parsing, try extracting from text
                    if (productIds.length === 0) {
                        productIds = extractProductIds(messageContent);
                    }
                }
                
                const productImagesHtml = productIds.length > 0 ? createProductImages(productIds) : '';
                
                div.innerHTML = `
                    <div class="message-header">
                        <span class="message-type ${msg.type?.toLowerCase()}">${msg.type || 'Unknown'}</span>
                        <span class="message-time">${msg.timestamp || ''}</span>
                    </div>
                    <div class="message-content">
                        <div class="message-text">${messageContent}</div>
                        ${productImagesHtml}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function displayConversationComments() {
            const comments = annotations.comments[currentConversationId] || [];
            const display = document.getElementById('conversationCommentsList');
            display.innerHTML = comments.map(c => `<div class="comment">${c}</div>`).join('');
        }

        function addConversationComment() {
            if (!currentConversationId) return;

            const textarea = document.getElementById('conversationComment');
            const comment = textarea.value.trim();

            if (comment) {
                if (!annotations.comments[currentConversationId]) {
                    annotations.comments[currentConversationId] = [];
                }

                annotations.comments[currentConversationId].push(comment);
                displayConversationComments();
                textarea.value = '';
            }
        }

        function exportAnnotations() {
            const dataStr = JSON.stringify(annotations, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `annotations-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadAnnotations() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        annotations = JSON.parse(event.target.result);
                        displayConversations();
                        if (currentConversationId) {
                            displayConversationTags();
                            selectConversation(currentConversationId);
                        }
                        alert('Annotations loaded successfully!');
                    } catch (err) {
                        alert('Error loading annotations: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
    </script>
</body>
